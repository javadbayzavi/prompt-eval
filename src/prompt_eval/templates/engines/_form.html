{# Shared engine form fields; `engine` is None when creating. #}
<datalist id="model-suggestions">
  {% for model in model_suggestions %}<option value="{{ model }}">{% endfor %}
</datalist>

<div class="grid">
  <div class="stack">
    <label for="name">Name</label>
    <input name="name" id="name" value="{{ engine.name if engine else '' }}" required placeholder="e.g. opus or local-qwen">
  </div>
  <div class="stack">
    <label for="provider">Provider</label>
    <select name="provider" id="provider">
      {% for p in providers %}
      <option value="{{ p.value }}" {% if engine and engine.provider == p %}selected{% endif %}>
        {{ 'Anthropic' if p.value == 'anthropic' else 'OpenAI-compatible (LM Studio)' }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="stack">
    <label for="model">Model</label>
    <input name="model" id="model" list="model-suggestions" value="{{ engine.model if engine else '' }}" required>
  </div>
  <div class="stack">
    <label for="max_tokens">Max output tokens</label>
    <input name="max_tokens" id="max_tokens" inputmode="numeric" value="{{ engine.max_tokens if engine else 8192 }}">
  </div>
</div>

<fieldset class="grid">
  <legend>Anthropic</legend>
  <div class="stack">
    <label for="effort">Effort <span class="muted">(blank = model default)</span></label>
    <select name="effort" id="effort">
      <option value="">default</option>
      {% for level in effort_levels %}
      <option value="{{ level }}" {% if engine and engine.effort == level %}selected{% endif %}>{{ level }}</option>
      {% endfor %}
    </select>
  </div>
  <p class="muted hint">The key comes from <code>ANTHROPIC_API_KEY</code> in <code>.env</code>.</p>
</fieldset>

<fieldset class="grid">
  <legend>OpenAI-compatible</legend>
  <div class="stack">
    <label for="base_url">Base URL <span class="muted">(blank = LMSTUDIO_BASE_URL)</span></label>
    <input name="base_url" id="base_url" value="{{ engine.base_url if engine else '' }}" placeholder="http://localhost:1234/v1">
  </div>
  <div class="stack">
    <label for="temperature">Temperature</label>
    <input name="temperature" id="temperature" inputmode="decimal" value="{{ engine.temperature if engine and engine.temperature is not none else '' }}">
  </div>
</fieldset>

<fieldset class="grid">
  <legend>Limits</legend>
  <div class="stack">
    <label for="max_concurrency">Parallel requests</label>
    <input name="max_concurrency" id="max_concurrency" inputmode="numeric" value="{{ engine.max_concurrency if engine else 2 }}">
  </div>
  <div class="stack">
    <label for="requests_per_minute">Requests / min</label>
    <input name="requests_per_minute" id="requests_per_minute" inputmode="numeric" value="{{ (engine.requests_per_minute or '') if engine else '' }}" placeholder="no limit">
  </div>
  <div class="stack">
    <label for="tokens_per_minute">Tokens / min</label>
    <input name="tokens_per_minute" id="tokens_per_minute" inputmode="numeric" value="{{ (engine.tokens_per_minute or '') if engine else '' }}" placeholder="no limit">
  </div>
  <div class="stack">
    <label for="max_retries">Max retries</label>
    <input name="max_retries" id="max_retries" inputmode="numeric" value="{{ engine.max_retries if engine else 5 }}">
  </div>
  <div class="stack">
    <label for="timeout_seconds">Timeout (s)</label>
    <input name="timeout_seconds" id="timeout_seconds" inputmode="decimal" value="{{ engine.timeout_seconds if engine else 600 }}">
  </div>
</fieldset>
